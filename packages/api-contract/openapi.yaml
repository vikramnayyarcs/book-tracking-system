openapi: 3.1.0
info:
  title: Book API
  version: 1.0.0
  description: The only way clients read or write data. Errors use RFC 9457 problem+json.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the API is running
      security: []
      responses:
        "200":
          description: The API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in user, creating the account on the first call
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books:
    get:
      operationId: listBooks
      summary: List the caller's books, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookStatus"
      responses:
        "200":
          description: The caller's books
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBook
      summary: Add a book, including a past book added retrospectively
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: The new book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBook
      summary: Get one book
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBook
      summary: Change a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: The changed book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBook
      summary: Delete a book with its sessions, insights and stored audio and photos
      responses:
        "204":
          description: The book is deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /tokens:
    get:
      operationId: listTokens
      summary: List your personal access tokens (the secret is never returned)
      responses:
        "200":
          description: Your tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      summary: Create a personal access token; the secret is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: The new token, with its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeToken
      summary: Revoke a personal access token
      responses:
        "204":
          description: The token is revoked
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /lookup/isbn/{isbn}:
    get:
      operationId: lookupIsbn
      summary: Look a book up by ISBN in Open Library
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The book details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookLookup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listBookSessions
      summary: List the reading sessions of one book, newest first
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions:
    post:
      operationId: createSession
      summary: Create a reading session; a retry with the same id returns the same session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "200":
          description: A session with this id already exists and is returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "201":
          description: The new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSession
      summary: Get one session; clients poll this while it is processed
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSession
      summary: Change a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: The changed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      summary: Delete a session with its insights and stored audio
      responses:
        "204":
          description: The session is deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions/{id}/audio-upload:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createAudioUpload
      summary: Get a signed URL to upload the audio of a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioUploadCreate"
      responses:
        "200":
          description: The signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioUpload"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Clerk session token or a personal access token
  schemas:
    Session:
      type: object
      required:
        - id
        - bookId
        - date
        - pageFrom
        - pageTo
        - chapter
        - noteText
        - noteSource
        - audioSeconds
        - hasAudio
        - status
        - errorCode
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        pageFrom:
          type: [integer, "null"]
        pageTo:
          type: [integer, "null"]
        chapter:
          type: [string, "null"]
        noteText:
          type: [string, "null"]
        noteSource:
          type: string
          enum: [typed, voice]
        audioSeconds:
          type: [integer, "null"]
        hasAudio:
          type: boolean
        status:
          type: string
          enum: [draft, uploaded, transcribing, extracting, ready, failed]
        errorCode:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
    SessionCreate:
      type: object
      additionalProperties: false
      required: [id, bookId, date]
      properties:
        id:
          type: string
          format: uuid
          description: Chosen by the client so a retry is safe
        bookId:
          type: string
          format: uuid
        date:
          type: string
          format: date
        pageFrom:
          type: integer
          minimum: 1
        pageTo:
          type: integer
          minimum: 1
        chapter:
          type: string
          maxLength: 300
        noteText:
          type: string
          maxLength: 20000
    SessionUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        date:
          type: string
          format: date
        pageFrom:
          type: [integer, "null"]
          minimum: 1
        pageTo:
          type: [integer, "null"]
          minimum: 1
        chapter:
          type: [string, "null"]
          maxLength: 300
        noteText:
          type: [string, "null"]
          maxLength: 20000
    AudioUploadCreate:
      type: object
      additionalProperties: false
      required: [durationSeconds]
      properties:
        durationSeconds:
          type: integer
          minimum: 1
        extension:
          type: string
          enum: [m4a, mp3, wav, webm, ogg]
          default: m4a
    AudioUpload:
      type: object
      required: [uploadUrl, path, expiresInSeconds]
      properties:
        uploadUrl:
          type: string
          description: Send the audio bytes to this URL with PUT
        path:
          type: string
        expiresInSeconds:
          type: integer
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    BookStatus:
      type: string
      enum: [reading, finished, abandoned]
    FinishedPrecision:
      type: string
      enum: [day, month, year]
    Book:
      type: object
      required:
        - id
        - isbn
        - title
        - author
        - coverUrl
        - pageCount
        - status
        - startedOn
        - finishedOn
        - finishedPrecision
        - addedRetrospectively
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        isbn:
          type: [string, "null"]
        title:
          type: string
        author:
          type: [string, "null"]
        coverUrl:
          type: [string, "null"]
        pageCount:
          type: [integer, "null"]
        status:
          $ref: "#/components/schemas/BookStatus"
        startedOn:
          type: [string, "null"]
          format: date
        finishedOn:
          type: [string, "null"]
          format: date
        finishedPrecision:
          oneOf:
            - $ref: "#/components/schemas/FinishedPrecision"
            - type: "null"
        addedRetrospectively:
          type: boolean
        createdAt:
          type: string
          format: date-time
    BookCreate:
      type: object
      required: [title]
      additionalProperties: false
      properties:
        isbn:
          type: string
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
        coverUrl:
          type: string
        pageCount:
          type: integer
          minimum: 1
        status:
          $ref: "#/components/schemas/BookStatus"
        startedOn:
          type: string
          format: date
        finishedOn:
          type: string
          format: date
        finishedPrecision:
          $ref: "#/components/schemas/FinishedPrecision"
        addedRetrospectively:
          type: boolean
    BookUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        isbn:
          type: [string, "null"]
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: [string, "null"]
        coverUrl:
          type: [string, "null"]
        pageCount:
          type: [integer, "null"]
          minimum: 1
        status:
          $ref: "#/components/schemas/BookStatus"
        startedOn:
          type: [string, "null"]
          format: date
        finishedOn:
          type: [string, "null"]
          format: date
        finishedPrecision:
          oneOf:
            - $ref: "#/components/schemas/FinishedPrecision"
            - type: "null"
        addedRetrospectively:
          type: boolean
    BookLookup:
      type: object
      required: [isbn, title, author, coverUrl, pageCount]
      properties:
        isbn:
          type: string
        title:
          type: string
        author:
          type: [string, "null"]
        coverUrl:
          type: [string, "null"]
        pageCount:
          type: [integer, "null"]
    TokenScope:
      type: string
      enum: [sessions:write, books:read]
    Token:
      type: object
      required: [id, name, scopes, createdAt, lastUsedAt, revokedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            $ref: "#/components/schemas/TokenScope"
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: [string, "null"]
          format: date-time
        revokedAt:
          type: [string, "null"]
          format: date-time
    TokenCreate:
      type: object
      required: [name, scopes]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        scopes:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/TokenScope"
    TokenCreated:
      allOf:
        - $ref: "#/components/schemas/Token"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The secret. It is shown once and cannot be read again.
    Me:
      type: object
      required: [id, tier]
      properties:
        id:
          type: string
        tier:
          type: string
          enum: [free, plus]
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: A stable machine-readable error code, for example tier_limit_reached
  responses:
    Problem:
      description: An error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
