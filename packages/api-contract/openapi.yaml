openapi: 3.1.0
info:
  title: Book API
  version: 1.0.0
  description: The only way clients read or write data. Errors use RFC 9457 problem+json.
servers:
  - url: /v1
security:
  - bearerAuth: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Check that the API is running
      security: []
      responses:
        "200":
          description: The API is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"
  /me:
    get:
      operationId: getMe
      summary: Get the signed-in user, creating the account on the first call
      responses:
        "200":
          description: The signed-in user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books:
    get:
      operationId: listBooks
      summary: List the caller's books, newest first
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/BookStatus"
      responses:
        "200":
          description: The caller's books
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBook
      summary: Add a book, including a past book added retrospectively
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookCreate"
      responses:
        "201":
          description: The new book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBook
      summary: Get one book
      responses:
        "200":
          description: The book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateBook
      summary: Change a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookUpdate"
      responses:
        "200":
          description: The changed book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteBook
      summary: Delete a book with its sessions, insights and stored audio and photos
      responses:
        "204":
          description: The book is deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /tokens:
    get:
      operationId: listTokens
      summary: List your personal access tokens (the secret is never returned)
      responses:
        "200":
          description: Your tokens, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Token"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createToken
      summary: Create a personal access token; the secret is shown once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenCreate"
      responses:
        "201":
          description: The new token, with its secret
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenCreated"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /tokens/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      operationId: revokeToken
      summary: Revoke a personal access token
      responses:
        "204":
          description: The token is revoked
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /lookup/isbn/{isbn}:
    get:
      operationId: lookupIsbn
      summary: Look a book up by ISBN in Open Library
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The book details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookLookup"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/sessions:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listBookSessions
      summary: List the reading sessions of one book, newest first
      responses:
        "200":
          description: The sessions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions:
    post:
      operationId: createSession
      summary: Create a reading session; a retry with the same id returns the same session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionCreate"
      responses:
        "200":
          description: A session with this id already exists and is returned unchanged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "201":
          description: The new session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSession
      summary: Get one session; clients poll this while it is processed
      responses:
        "200":
          description: The session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateSession
      summary: Change a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionUpdate"
      responses:
        "200":
          description: The changed session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSession
      summary: Delete a session with its insights and stored audio
      responses:
        "204":
          description: The session is deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions/{id}/audio-upload:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createAudioUpload
      summary: Get a signed URL to upload the audio of a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioUploadCreate"
      responses:
        "200":
          description: The signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioUpload"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions/{id}/process:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: processSession
      summary: Transcribe (voice only) and extract insights in the background
      description: >
        Returns 202 at once. The session moves through `transcribing` (voice
        only) and `extracting` to `ready`, or to `failed` with an `errorCode`.
        Clients poll `GET /sessions/{id}`. A failed session can be processed
        again.
      responses:
        "202":
          description: Processing started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/reflections:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listBookReflections
      summary: List the reflection questions and answers of one book
      responses:
        "200":
          description: The reflections, by stage and position
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Reflection"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createBookReflections
      summary: Ask 3 reflection questions for a stage, written from the reader's own notes
      description: >
        Stage `mid` or `end`: questions come from the reader's own notes, so the
        book needs at least one session note or insight, else 422. Stage
        `recall` is for past books: 3 prompts that help the reader remember the
        book, written from the title and author only. If the book already has
        questions for the stage, they are returned with 200 and nothing new is
        generated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionCreate"
      responses:
        "200":
          description: Questions already existed for this stage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionList"
        "201":
          description: New questions generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionList"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /reflections/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: answerReflection
      summary: Save the answer to a reflection question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReflectionAnswer"
      responses:
        "200":
          description: The updated reflection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reflection"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/insights:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listBookInsights
      summary: List the insights and quotes of one book, pinned first
      responses:
        "200":
          description: The insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createInsight
      summary: Add an insight or quote written by the user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightCreate"
      responses:
        "201":
          description: The new insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insight"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /sessions/{id}/insights:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listSessionInsights
      summary: List the insights and quotes of one session
      responses:
        "200":
          description: The insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightList"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /insights/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateInsight
      summary: Edit, pin or unpin an insight; the first AI wording is kept in originalText
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightUpdate"
      responses:
        "200":
          description: The changed insight
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Insight"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteInsight
      summary: Delete an insight
      responses:
        "204":
          description: The insight is deleted
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /search:
    get:
      operationId: searchVault
      summary: Search the caller's session notes, insights, quotes and reviews, best match first
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: The matches
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /export:
    get:
      operationId: exportVault
      summary: Export the caller's books, sessions, insights, reviews and reflections as one file (no audio or photos)
      parameters:
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [json, markdown]
      responses:
        "200":
          description: The export, sent as a download
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Export"
            text/markdown:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/finish:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: finishBook
      summary: Mark a book finished, with an optional rating and review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FinishCreate"
      responses:
        "200":
          description: The finished book and its review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinishResult"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/review:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getBookReview
      summary: Get the rating, review and finish photo flag of a book
      responses:
        "200":
          description: The review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/summary:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: regenerateBookSummary
      summary: Write the book summary again from the reader's own notes (Plus tier)
      description: >
        Plus tier only; the free tier gets 403 with code
        `tier_feature_unavailable`. The summary uses only the reader's session
        notes and insights of this book, so a book with none returns 422. The
        summary is also written in the background when a Plus reader finishes a
        book. Returns 502 when the AI service fails; the old summary stays.
      responses:
        "200":
          description: The review with the new summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/Problem"
        "403":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "502":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /books/{id}/finish-photo:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createFinishPhotoUpload
      summary: Get a signed URL to upload the finish photo of a book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhotoUploadCreate"
      responses:
        "200":
          description: The signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoUpload"
        "400":
          $ref: "#/components/responses/Problem"
        "401":
          $ref: "#/components/responses/Problem"
        "404":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Clerk session token or a personal access token
  schemas:
    Review:
      type: object
      required: [rating, text, summary, hasPhoto]
      properties:
        rating:
          type: [integer, "null"]
        text:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        hasPhoto:
          type: boolean
    FinishCreate:
      type: object
      additionalProperties: false
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          maxLength: 20000
        finishedOn:
          type: string
          format: date
          description: Defaults to today
        finishedPrecision:
          $ref: "#/components/schemas/FinishedPrecision"
    FinishResult:
      type: object
      required: [book, review]
      properties:
        book:
          $ref: "#/components/schemas/Book"
        review:
          $ref: "#/components/schemas/Review"
    PhotoUploadCreate:
      type: object
      additionalProperties: false
      required: [extension]
      properties:
        extension:
          type: string
          enum: [jpg, png, webp]
    PhotoUpload:
      type: object
      required: [uploadUrl, path, expiresInSeconds]
      properties:
        uploadUrl:
          type: string
          description: Send the image bytes to this URL with PUT
        path:
          type: string
        expiresInSeconds:
          type: integer
    Export:
      type: object
      required: [exportedAt, books]
      properties:
        exportedAt:
          type: string
          format: date-time
        books:
          type: array
          items:
            $ref: "#/components/schemas/ExportBook"
    ExportBook:
      allOf:
        - $ref: "#/components/schemas/Book"
        - type: object
          required: [review, sessions, insights, reflections]
          properties:
            review:
              oneOf:
                - $ref: "#/components/schemas/ExportReview"
                - type: "null"
            sessions:
              type: array
              items:
                $ref: "#/components/schemas/Session"
            insights:
              type: array
              items:
                $ref: "#/components/schemas/Insight"
            reflections:
              type: array
              items:
                $ref: "#/components/schemas/ExportReflection"
    ExportReview:
      type: object
      required: [rating, text, summary]
      properties:
        rating:
          type: [integer, "null"]
        text:
          type: [string, "null"]
        summary:
          type: [string, "null"]
    ExportReflection:
      type: object
      required: [stage, position, question, answer]
      properties:
        stage:
          type: string
          enum: [mid, end, recall]
        position:
          type: integer
        question:
          type: string
        answer:
          type: [string, "null"]
    SearchResult:
      type: object
      required: [kind, id, bookId, bookTitle, snippet, rank]
      properties:
        kind:
          type: string
          enum: [session, insight, quote, review]
        id:
          type: string
          format: uuid
          description: The session or insight ID; for a review, the book ID
        bookId:
          type: string
          format: uuid
        bookTitle:
          type: string
        snippet:
          type: string
          description: A short excerpt around the match, with matches wrapped in square brackets
        rank:
          type: number
    Insight:
      type: object
      required:
        - id
        - bookId
