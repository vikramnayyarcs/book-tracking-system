name: Deploy dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/envs/dev/**"
      - "infra/modules/**"
      - "infra/r2.tfbackend"
      - "apps/site/**"
      - "apps/web/**"
      - "packages/api-contract/**"
      - "supabase/**"
      - "packages/core/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-dev.yml"

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      infra: ${{ steps.diff.outputs.infra }}
      site: ${{ steps.diff.outputs.site }}
      web: ${{ steps.diff.outputs.web }}
      database: ${{ steps.diff.outputs.database }}
      api: ${{ steps.diff.outputs.api }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "infra=true" >> "$GITHUB_OUTPUT"
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "database=true" >> "$GITHUB_OUTPUT"
            echo "api=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed() { git diff --quiet "$BEFORE" "$GITHUB_SHA" -- "$@" && echo false || echo true; }
          echo "infra=$(changed infra .github/workflows/deploy-dev.yml)" >> "$GITHUB_OUTPUT"
          echo "database=$(changed supabase infra/envs/dev .github/workflows/deploy-dev.yml)" >> "$GITHUB_OUTPUT"
          echo "api=$(changed supabase/functions supabase/config.toml packages/core packages/api-contract .github/workflows/deploy-dev.yml)" >> "$GITHUB_OUTPUT"
          echo "web=$(changed apps/web packages/core packages/api-contract infra/envs/dev infra/modules package.json package-lock.json .github/workflows/deploy-dev.yml)" >> "$GITHUB_OUTPUT"
          echo "site=$(changed apps/site packages/core package.json package-lock.json .github/workflows/deploy-dev.yml)" >> "$GITHUB_OUTPUT"

  terraform:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_github_app_id: ${{ vars.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_supabase_organization_id: ${{ vars.DEV_SUPABASE_ORG_ID }}
      TF_VAR_clerk_frontend_api_url: ${{ vars.DEV_CLERK_FRONTEND_API_URL }}
      TF_VAR_groq_api_key: ${{ secrets.DEV_GROQ_API_KEY }}
      TF_VAR_workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      TF_VAR_grafana_stack_slug: ${{ vars.GRAFANA_STACK_SLUG }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_FRONTEND_O11Y_API_ACCESS_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - run: terraform init -backend-config=../../r2.tfbackend -lockfile=readonly

      - name: Plan
        run: |
          terraform plan -out=dev.tfplan -no-color | tee plan.txt
          { echo '```'; tail -n 60 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Apply
        run: terraform apply dev.tfplan

  site:
    needs: [changes, terraform]
    if: ${{ !cancelled() && needs.changes.outputs.site == 'true' && needs.terraform.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the site
        run: npm -w @book-tracking-system/site run build

      - name: Deploy to site-dev
        run: npx wrangler pages deploy apps/site/dist --project-name=site-dev --branch=main --commit-dirty=true

  web:
    needs: [changes, terraform]
    if: ${{ !cancelled() && needs.changes.outputs.web == 'true' && needs.terraform.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DEV_CLERK_PUBLISHABLE_KEY: ${{ vars.DEV_CLERK_PUBLISHABLE_KEY }}
      DEV_CLERK_FRONTEND_API_URL: ${{ vars.DEV_CLERK_FRONTEND_API_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check the Clerk key belongs to the dev instance
        run: node scripts/clerk/publishable-key.ts

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Read the web build settings from Terraform
        working-directory: infra/envs/dev
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
          AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -backend-config=../../r2.tfbackend -lockfile=readonly > /dev/null
          faro_url="$(terraform output -raw faro_collector_url)"
          api_url="$(terraform output -raw api_gateway_url)"
          test -n "$faro_url" || { echo "::error::Terraform has no faro_collector_url output. Run the Terraform job first."; exit 1; }
          {
            echo "VITE_FARO_COLLECTOR_URL=${faro_url}"
            echo "VITE_API_BASE_URL=${api_url}"
          } >> "$GITHUB_ENV"

      - name: Build the web app
        run: npm -w @book-tracking-system/web run build

      - name: Deploy to web-dev
        run: npx wrangler pages deploy apps/web/dist --project-name=web-dev --branch=main --commit-dirty=true

  migrations:
    needs: [changes, terraform]
    if: ${{ !cancelled() && needs.changes.outputs.database == 'true' && needs.terraform.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: npm ci

      - name: Check that the project is set up for migrations
        run: |
          test -f supabase/config.toml || { echo "::error::supabase/config.toml is missing."; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::DEV_SUPABASE_PROJECT_REF is not set. Run the Terraform job first."; exit 1; }

      - name: Link the dev project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"

      - name: Apply migrations to dev
        run: npx supabase db push --remote --yes

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Read the jobs settings from Terraform
        working-directory: infra/envs/dev
        env:
          TF_IN_AUTOMATION: "true"
          TF_INPUT: "false"
          AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
        run: |
          terraform init -backend-config=../../r2.tfbackend -lockfile=readonly > /dev/null
          jobs_secret="$(terraform output -raw jobs_secret)"
          echo "::add-mask::${jobs_secret}"
          jobs_url="$(terraform output -raw jobs_url)"
          test -n "$jobs_secret" && test -n "$jobs_url" || { echo "::error::Terraform has no jobs_url or jobs_secret output. Run the Terraform job first."; exit 1; }
          {
            echo "JOBS_SECRET=${jobs_secret}"
            echo "JOBS_URL=${jobs_url}"
          } >> "$GITHUB_ENV"

      - name: Upsert the jobs settings into Vault
        env:
          SUPABASE_YES: "true"
        run: |
          # Terraform cannot run SQL, so this is the one step that copies the
          # Terraform values into the database. It is safe to run again.
          sql="$RUNNER_TEMP/jobs-vault.sql"
          trap 'rm -f "$sql"' EXIT
          for name in jobs_url jobs_secret; do
            if [ "$name" = jobs_url ]; then value="$JOBS_URL"; else value="$JOBS_SECRET"; fi
            case "$value" in *"'"*) echo "::error::Unexpected quote in ${name}."; exit 1;; esac
            cat >> "$sql" <<SQL
          do \$\$
          declare existing uuid;
          begin
            select id into existing from vault.secrets where name = '${name}';
            if existing is null then
              perform vault.create_secret('${value}', '${name}');
            else
              perform vault.update_secret(existing, '${value}');
            end if;
          end
          \$\$;
          SQL
          done
          npx supabase db query --remote --file "$sql" > /dev/null

  api:
    needs: [changes, terraform, migrations]
    if: ${{ !cancelled() && needs.changes.outputs.api == 'true' && needs.terraform.result != 'failure' && needs.migrations.result != 'failure' }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.DEV_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Deploy the api function to dev
        run: npx supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
