name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "${archive}" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - run: npm ci

      - name: Install ffmpeg for the video builder test
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Secrets scan (full history)
        run: gitleaks git --redact --verbose --no-banner .

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: API contract types are up to date
        run: npm run contract:check

      - name: Every contract operation has a Bruno request
        run: node scripts/bruno-check/check.ts

      - name: Test
        run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright and axe
        run: npx playwright test --trace off

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  web-e2e:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the web app change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- apps/web packages/core packages/api-contract supabase test/e2e playwright.web.config.ts .github/workflows/ci.yml .github/actions/local-stack package.json; then
            echo "web=false" >> "$GITHUB_OUTPUT"
            echo "No web changes; skipping."
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.web == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.changed.outputs.web == 'true'

      - uses: ./.github/actions/local-stack
        if: steps.changed.outputs.web == 'true'
        with:
          clerk-issuer: ${{ vars.DEV_CLERK_FRONTEND_API_URL }}

      - name: Install Chromium
        if: steps.changed.outputs.web == 'true'
        run: npx playwright install --with-deps chromium

      - name: Playwright and axe
        if: steps.changed.outputs.web == 'true'
        env:
          DEV_CLERK_PUBLISHABLE_KEY: ${{ vars.DEV_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.DEV_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
        run: npx playwright test --config playwright.web.config.ts --trace off

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.changed.outputs.web == 'true'
        with:
          name: playwright-report-web
          path: playwright-report
          retention-days: 7

      - name: Show the function log
        if: failure() && steps.changed.outputs.web == 'true'
        run: tail -n 60 "$RUNNER_TEMP/functions.log"

      - name: Stop the stack
        if: always() && steps.changed.outputs.web == 'true'
        run: npx supabase stop --no-backup

  pr-video:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint the narration scripts
        run: node scripts/video/lint-script.ts docs/videos/*.txt

      - name: Install ffmpeg, Piper and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python3 -m venv "$RUNNER_TEMP/piper"
          "$RUNNER_TEMP/piper/bin/pip" install --quiet --require-hashes -r scripts/video/piper-requirements.txt
          npx playwright install --with-deps chromium

      - name: Download the voice
        id: voice
        run: |
          voice="$RUNNER_TEMP/voice"
          mkdir -p "$voice"
          name="$(jq -r .name scripts/video/voice.json)"
          curl -fsSL "$(jq -r .modelUrl scripts/video/voice.json)" -o "$voice/${name}.onnx"
          curl -fsSL "$(jq -r .configUrl scripts/video/voice.json)" -o "$voice/${name}.onnx.json"
          echo "$(jq -r .modelSha256 scripts/video/voice.json)  $voice/${name}.onnx" | sha256sum --check
          echo "$(jq -r .configSha256 scripts/video/voice.json)  $voice/${name}.onnx.json" | sha256sum --check
          echo "model=$voice/${name}.onnx" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/local-stack
        with:
          clerk-issuer: ${{ vars.DEV_CLERK_FRONTEND_API_URL }}

      - name: Record the site demo
        run: PW_VIDEO=on npx playwright test --trace off --output test-results/site

      - name: Record the app demos
        env:
          PW_VIDEO: "on"
          PW_SUITE: demo
          DEV_CLERK_PUBLISHABLE_KEY: ${{ vars.DEV_CLERK_PUBLISHABLE_KEY }}
          CLERK_PUBLISHABLE_KEY: ${{ vars.DEV_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
        run: |
          for file in test/e2e/demo/*.demo.ts; do
            name="$(basename "$file" .demo.ts)"
            if [ ! -f "docs/videos/${name}.txt" ]; then
              echo "::error file=${file}::docs/videos/${name}.txt is missing"
              exit 1
            fi
            npx playwright test --config playwright.web.config.ts --trace off --output "test-results/demo-${name}" "$file"
          done

      - name: Record the API request logs
        env:
          API_LOG_DIR: ${{ runner.temp }}/api-logs
          GATEWAY_SECRET: ci-gateway-secret
          API_BASE_URL: http://127.0.0.1:54321/functions/v1/api
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
        run: npx vitest run --config vitest.api.config.ts test/api/books.test.ts test/api/sessions.test.ts test/api/processing.test.ts

      - name: Build the explainer videos
        env:
          PIPER_BIN: ${{ runner.temp }}/piper/bin/piper
        run: |
          mkdir -p videos
          build() {
            name="$1"
            dir="$2"
            demo="$(find "$dir" -name 'video.webm' | head -n 1)"
            node scripts/video/build-video.ts "$demo" "docs/videos/${name}.txt" "${{ steps.voice.outputs.model }}" "videos/${name}-explainer.mp4"
            cp "$demo" "videos/${name}-demo.webm"
          }
          build site test-results/site
          node scripts/video/build-api-video.ts docs/videos/books.txt "${{ steps.voice.outputs.model }}" videos/books-explainer.mp4 "$RUNNER_TEMP/api-logs/books.jsonl"
          node scripts/video/build-api-video.ts docs/videos/sessions.txt "${{ steps.voice.outputs.model }}" videos/sessions-explainer.mp4 "$RUNNER_TEMP/api-logs/sessions.jsonl" "$RUNNER_TEMP/api-logs/processing.jsonl"
          for file in test/e2e/demo/*.demo.ts; do
            name="$(basename "$file" .demo.ts)"
            build "$name" "test-results/demo-${name}"
          done

      - name: Stop the stack
        if: always()
        run: npx supabase stop --no-backup

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: pr-videos
          path: videos
          retention-days: 30

      - name: Link the videos
        run: echo "Videos, built from seeded test data only - ${{ steps.upload.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"

  database:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the database change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- supabase .github/workflows/ci.yml package.json; then
            echo "database=false" >> "$GITHUB_OUTPUT"
            echo "No database changes; skipping."
          else
            echo "database=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.database == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.changed.outputs.database == 'true'

      - name: Start the local Supabase stack
        if: steps.changed.outputs.database == 'true'
        run: npx supabase start

      - name: Apply migrations and seed from scratch
        if: steps.changed.outputs.database == 'true'
        run: npx supabase db reset

      - name: Run the pgTAP tests
        if: steps.changed.outputs.database == 'true'
        run: npx supabase test db

      - name: Stop the stack
        if: always() && steps.changed.outputs.database == 'true'
        run: npx supabase stop --no-backup

  api:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      GATEWAY_SECRET: ci-gateway-secret
      JOBS_SECRET: ci-jobs-secret
      DEFAULT_TIER: plus
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      CLERK_ISSUER: ${{ vars.DEV_CLERK_FRONTEND_API_URL }}
      CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
      API_BASE_URL: http://127.0.0.1:54321/functions/v1/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did the API change?
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- packages supabase test/api vitest.api.config.ts .github/workflows/ci.yml package.json; then
            echo "api=false" >> "$GITHUB_OUTPUT"
            echo "No API changes; skipping."
          else
            echo "api=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.api == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
        if: steps.changed.outputs.api == 'true'

      - name: Start the local Supabase stack
        if: steps.changed.outputs.api == 'true'
        run: npx supabase start

      - name: Serve the api function
        if: steps.changed.outputs.api == 'true'
        run: |
          {
            echo "GATEWAY_SECRET=${GATEWAY_SECRET}"
            echo "JOBS_SECRET=${JOBS_SECRET}"
            echo "DEFAULT_TIER=${DEFAULT_TIER}"
            echo "CLERK_ISSUER=${CLERK_ISSUER}"
            echo "GROQ_API_KEY=unused-in-tests"
            echo "GROQ_URL=http://host.docker.internal:54390/openai/v1"
            echo "VAPID_PUBLIC_KEY=$(openssl ecparam -name prime256v1 -genkey -noout | openssl pkey -pubout | grep -v '^-----' | tr -d '\n')"
          } > "$RUNNER_TEMP/functions.env"
          npx supabase functions serve api --no-verify-jwt --env-file "$RUNNER_TEMP/functions.env" > "$RUNNER_TEMP/functions.log" 2>&1 &
          if ! timeout 120 bash -c 'until curl -fsS -H "x-gateway-secret: ${GATEWAY_SECRET}" "${API_BASE_URL}/v1/health" > /dev/null; do sleep 2; done'; then
            echo "The api function did not start. Last lines of its log:"
            tail -n 40 "$RUNNER_TEMP/functions.log"
            exit 1
          fi

      - name: Run the API tests
        if: steps.changed.outputs.api == 'true'
        run: npm run test:api

      - name: Show the function log
        if: failure() && steps.changed.outputs.api == 'true'
        run: tail -n 60 "$RUNNER_TEMP/functions.log"

      - name: Stop the stack
        if: always() && steps.changed.outputs.api == 'true'
        run: npx supabase stop --no-backup

  terraform:
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive -diff infra

      - name: Validate every root
        run: |
          for dir in infra/bootstrap infra/envs/*/; do
            [ -d "$dir" ] || continue
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -lockfile=readonly
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan-dev:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    defaults:
      run:
        working-directory: infra/envs/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_github_app_id: ${{ vars.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_supabase_organization_id: ${{ vars.DEV_SUPABASE_ORG_ID }}
      TF_VAR_clerk_frontend_api_url: ${{ vars.DEV_CLERK_FRONTEND_API_URL }}
      TF_VAR_groq_api_key: ${{ secrets.DEV_GROQ_API_KEY }}
      TF_VAR_workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      TF_VAR_grafana_stack_slug: ${{ vars.GRAFANA_STACK_SLUG }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_FRONTEND_O11Y_API_ACCESS_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Did infra change?
        id: changed
        working-directory: .
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- infra .github/workflows/deploy-dev.yml; then
            echo "infra=false" >> "$GITHUB_OUTPUT"
            echo "No infra changes; skipping plan."
          else
            echo "infra=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: steps.changed.outputs.infra == 'true'
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - name: Plan dev
        if: steps.changed.outputs.infra == 'true'
        run: |
          set -o pipefail
          terraform init -backend-config=../../r2.tfbackend -lockfile=readonly
          terraform plan -lock-timeout=5m -no-color | tee plan.txt
          { echo '## Plan for dev'; echo '```'; tail -n 80 plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  cloud-setup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: First run installs the pinned tools
        run: sudo env "PATH=$PATH" bash scripts/cloud-setup.sh

      - name: Second run changes nothing
        run: |
          before="$(sha256sum /usr/local/bin/{node,terraform,gitleaks,terraform-mcp-server})"
          sudo env "PATH=$PATH" bash scripts/cloud-setup.sh
          after="$(sha256sum /usr/local/bin/{node,terraform,gitleaks,terraform-mcp-server})"
          [ "$before" = "$after" ]
