name: Key check

on:
  pull_request:
    paths:
      - "scripts/key-check/**"
      - ".github/workflows/key-check.yml"
      - "docs/secrets.md"
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  issues: write

jobs:
  keys:
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_GITHUB_APP_ID: ${{ vars.TF_GITHUB_APP_ID }}
      TF_GITHUB_APP_PRIVATE_KEY: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
      TF_STATE_R2_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      TF_STATE_R2_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_REGION: ${{ vars.GRAFANA_REGION }}
      CLERK_SECRET_KEY: ${{ secrets.DEV_CLERK_SECRET_KEY }}
      GROQ_API_KEY: ${{ secrets.DEV_GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Test each key against its provider
        env:
          KEY_CHECK_RESULTS: ${{ runner.temp }}/key-check.json
        run: node scripts/key-check/check.ts

      - name: Open, update or close the Key check failed issue
        if: always() && github.event_name == 'schedule'
        env:
          KEY_CHECK_RESULTS: ${{ runner.temp }}/key-check.json
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/key-check/report.ts
