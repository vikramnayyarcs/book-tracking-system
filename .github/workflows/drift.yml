name: Drift check

on:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: terraform-dev
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        working-directory: infra/envs/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      TF_VAR_github_owner: ${{ github.repository_owner }}
      TF_VAR_github_repository: ${{ github.event.repository.name }}
      TF_VAR_github_app_id: ${{ vars.TF_GITHUB_APP_ID }}
      TF_VAR_github_app_installation_id: ${{ vars.TF_GITHUB_APP_INSTALLATION_ID }}
      TF_VAR_github_app_private_key: ${{ secrets.TF_GITHUB_APP_PRIVATE_KEY }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_supabase_organization_id: ${{ vars.DEV_SUPABASE_ORG_ID }}
      TF_VAR_clerk_frontend_api_url: ${{ vars.DEV_CLERK_FRONTEND_API_URL }}
      TF_VAR_groq_api_key: ${{ secrets.DEV_GROQ_API_KEY }}
      TF_VAR_workers_subdomain: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
      TF_VAR_grafana_stack_slug: ${{ vars.GRAFANA_STACK_SLUG }}
      TF_VAR_grafana_alert_email: ${{ secrets.GRAFANA_ALERT_EMAIL }}
      GRAFANA_CLOUD_ACCESS_POLICY_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      GRAFANA_FRONTEND_O11Y_API_ACCESS_TOKEN: ${{ secrets.GRAFANA_CLOUD_ACCESS_POLICY_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.DEV_SUPABASE_ACCESS_TOKEN }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - run: terraform init -backend-config=../../r2.tfbackend -lockfile=readonly

      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -lock-timeout=5m -no-color | tee plan.txt
          code="${PIPESTATUS[0]}"
          echo "code=${code}" >> "$GITHUB_OUTPUT"
          [ "$code" -ne 1 ]

      - name: Open or update the drift issue
        if: steps.plan.outputs.code == '2'
        working-directory: .
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Terraform drift in dev"
          {
            echo "The nightly plan for dev is not empty. Someone changed a resource by hand, or a merge has not been applied."
            echo
            echo "Run: ${RUN_URL}"
            echo
            echo '```'
            tail -n 80 infra/envs/dev/plan.txt
            echo '```'
          } > body.md
          gh label create drift --color B60205 --description "Terraform plan is not empty" 2>/dev/null || true
          number="$(gh issue list --state open --label drift --search "\"${title}\" in:title" --json number --jq '.[0].number')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$title" --label drift --body-file body.md
          fi
