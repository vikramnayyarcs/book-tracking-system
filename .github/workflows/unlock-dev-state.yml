name: Unlock dev state

on:
  workflow_dispatch:
    inputs:
      lock_id:
        description: Lock ID from the "Lock Info" block of the failed plan
        required: true
        type: string

permissions:
  contents: read

jobs:
  unlock:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/dev
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"
      LOCK_ID: ${{ inputs.lock_id }}
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_R2_SECRET_ACCESS_KEY }}
    steps:
      - name: Lock ID is a UUID
        working-directory: .
        run: |
          [[ "$LOCK_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]] || { echo "::error::Not a lock ID: $LOCK_ID"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false

      - run: terraform init -backend-config=../../r2.tfbackend -lockfile=readonly

      - name: Release the lock
        run: terraform force-unlock -force "$LOCK_ID"
